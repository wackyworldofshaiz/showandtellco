<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build your tote: Show and Tell Co</title>
<meta name="description" content="Show and Tell Co: printed pun cards, pick-your-patch totes and tees, and iron-on patches. Order on WhatsApp.">
<link rel="icon" type="image/png" href="images/brand/wordmark-violet.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#FDFDFD}
.disp{font-family:'Fraunces',Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1}
a{color:#5D1AFA}a:hover{color:#3D0CB0}
.pbtn:focus-visible,.lib:focus-visible,.pill:focus-visible,.act:focus-visible,.tab:focus-visible,.go:focus-visible{outline:3px solid #5D1AFA;outline-offset:3px}
.act:disabled{opacity:0.4;cursor:default}
.field:focus{outline:3px solid #5D1AFA;outline-offset:1px}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<noscript><p style="padding:16px;font-family:sans-serif">Please turn on JavaScript to use this page.</p></noscript>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #1A0B45; background: #FDFDFD">

<header style="background: #5D1AFA; color: #FDFDFD">
<div style="max-width: 1240px; margin: 0 auto; padding: 18px 5%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="Back to Show and Tell Co home" style="display: block; line-height: 0"><img src="images/brand/wordmark-white.png" alt="Show and Tell Co" style="height: 48px; width: auto"></a>
<nav aria-label="Builders" style="display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 16px; font-weight: 600">
<a href="build-your-tote.html" aria-current="page" style="color: #E4EE3F; text-decoration: none; padding: 10px 0">Build a tote</a>
<a href="cards.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Choose a card</a>
<a href="patches.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Shop patches</a>
</nav>
</div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 48px 5% 80px; display: flex; flex-direction: column; gap: 36px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 720px">
<h1 class="disp" style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 900; letter-spacing: -0.02em">Build your tote.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3B2E6B; max-width: 640px">Pick your base, add your favourite patches, make it yours. We press every patch on by hand before it goes out.</p>
<p style="margin: 4px 0 0; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #E4EE3F; color: #1A0B45; font-size: 14px; font-weight: 700"><svg viewBox="-44 -44 88 88" aria-hidden="true" style="width: 14px; height: 14px"><path d="M0 -44 C4 -12 12 -4 44 0 C12 4 4 12 0 44 C-4 12 -12 4 -44 0 C-12 -4 -4 -12 0 -44 Z" fill="#5D1AFA"></path></svg>Patch bar experience in Abuja and Barcelona</p>
</div>
<ol aria-label="Steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<sc-for list="{{ stepDots }}" as="d" hint-placeholder-count="3">
<li style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 6px; border-radius: 999px; background: {{ d.bg }}; color: {{ d.fg }}; font-size: 14px; font-weight: 700"><span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: {{ d.numBg }}; color: {{ d.numFg }}">{{ d.n }}</span>{{ d.label }}</li>
</sc-for>
</ol>
</div>

<!-- START: favourites or from scratch -->
<sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 56px">

<section aria-labelledby="fav-h" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<h2 id="fav-h" class="disp" style="margin: 0; font-size: 34px; font-weight: 900">Start from a favourite</h2>
<p style="margin: 0; font-size: 17px; color: #3B2E6B">Ready-made mixes. Take one as it is, or make it yours.</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 360px)); justify-content: center; gap: 20px">
<sc-for list="{{ presets }}" as="pr" hint-placeholder-count="3">
<li style="background: #EFE9FF; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; text-align: center">
<div aria-hidden="true" style="position: relative; width: 100%; aspect-ratio: 1 / 1">
<img src="{{ pr.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain">
<sc-for list="{{ pr.items }}" as="it" hint-placeholder-count="4">
<img src="{{ it.src }}" alt="" style="position: absolute; left: {{ it.x }}%; top: {{ it.y }}%; width: {{ it.w }}%; height: auto; transform: translate(-50%, -50%) rotate({{ it.r }}deg); filter: drop-shadow(0 2px 2px rgba(26, 11, 69, 0.25))">
</sc-for>
<img src="{{ pr.shade }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; pointer-events: none">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h3 class="disp" style="margin: 0; font-size: 24px; font-weight: 900">{{ pr.name }}</h3>
<p style="margin: 0; font-size: 15px; color: #3B2E6B">{{ pr.meta }}</p>
<p style="margin: 0; font-size: 16px; font-weight: 700">{{ pr.total }}</p>
</div>
<button class="go" type="button" onClick="{{ pr.use }}" style="min-height: 48px; border-radius: 999px; border: 0; background: #5D1AFA; color: #FDFDFD; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Make it mine</button>
</li>
</sc-for>
</ul>
</section>

<section aria-labelledby="blank-h" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<h2 id="blank-h" class="disp" style="margin: 0; font-size: 34px; font-weight: 900">Start from scratch</h2>
<p style="margin: 0; font-size: 17px; color: #3B2E6B">Grab a blank and build it patch by patch.</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 360px)); justify-content: center; gap: 20px">
<sc-for list="{{ blanks }}" as="b" hint-placeholder-count="2">
<li style="background: #F7F4FF; border: 2px solid #EFE9FF; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; text-align: center">
<div aria-hidden="true" style="position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 18px; background: #FDFDFD">
<img src="{{ b.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h3 class="disp" style="margin: 0; font-size: 24px; font-weight: 900">{{ b.name }}</h3>
<p style="margin: 0; font-size: 15px; color: #3B2E6B">{{ b.meta }}</p>
<p style="margin: 0; font-size: 16px; font-weight: 700">{{ b.price }}</p>
</div>
<button class="go" type="button" onClick="{{ b.use }}" style="min-height: 48px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Design this one</button>
</li>
</sc-for>
</ul>
</section>

</div>
</sc-if>

<!-- BUILD -->
<sc-if value="{{ isBuild }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

<!-- Preview -->
<section aria-label="Your tote preview" style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #EFE9FF; border-radius: 28px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px">
<sc-if value="{{ hasBack }}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Side" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #FDFDFD; gap: 4px">
<sc-for list="{{ sides }}" as="sd" hint-placeholder-count="2">
<button class="tab" type="button" aria-pressed="{{ sd.on }}" onClick="{{ sd.pick }}" style="min-height: 44px; min-width: 96px; padding: 0 18px; border-radius: 999px; border: 0; background: {{ sd.bg }}; color: {{ sd.fg }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{ sd.label }}</button>
</sc-for>
</div>
</sc-if>
<div onPointerDown="{{ onBgDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerLeave="{{ onUp }}" style="position: relative; width: 100%; max-width: 560px; aspect-ratio: 1 / 1; touch-action: none; user-select: none">
<img src="{{ bagImg }}" alt="{{ bagAlt }}" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none">
<sc-for list="{{ placed }}" as="p" hint-placeholder-count="3">
<button class="pbtn" type="button" aria-label="{{ p.label }}" onPointerDown="{{ p.down }}" onKeyDown="{{ p.key }}" onClick="{{ p.select }}" style="position: absolute; left: {{ p.x }}%; top: {{ p.y }}%; width: {{ p.w }}%; transform: translate(-50%, -50%) rotate({{ p.r }}deg); padding: 4px; margin: 0; border: 0; background: transparent; cursor: grab; outline: {{ p.ring }}; outline-offset: 2px; border-radius: 14px; line-height: 0; touch-action: none">
<img src="{{ p.src }}" alt="" draggable="false" style="width: 100%; height: auto; display: block; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(26, 11, 69, 0.25))">
</button>
</sc-for>
<img src="{{ bagShade }}" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; pointer-events: none">
</div>
<p style="margin: 0; font-size: 14px; color: #3B2E6B; text-align: center">{{ hint }}</p>
</div>

<div role="toolbar" aria-label="Edit patch" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<button class="act" type="button" onClick="{{ undo }}" disabled="{{ noUndo }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #1A0B45; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Undo</button>
<button class="act" type="button" onClick="{{ rotL }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Rotate left</button>
<button class="act" type="button" onClick="{{ rotR }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Rotate right</button>
<button class="act" type="button" onClick="{{ smaller }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Smaller</button>
<button class="act" type="button" onClick="{{ bigger }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Bigger</button>
<button class="act" type="button" onClick="{{ front }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Bring to front</button>
<button class="act" type="button" onClick="{{ back }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Send to back</button>
<button class="act" type="button" onClick="{{ dup }}" disabled="{{ noDup }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #5D1AFA; background: #FDFDFD; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Duplicate</button>
<button class="act" type="button" onClick="{{ remove }}" disabled="{{ noSel }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #1A0B45; background: #1A0B45; color: #FDFDFD; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Remove</button>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-radius: 18px; background: #1A0B45; color: #FDFDFD">
<p style="margin: 0; font-size: 15px">{{ countLabel }}</p>
<p style="margin: 0; font-size: 18px; font-weight: 700; color: #E4EE3F">Total {{ total }}</p>
</div>
</section>

<!-- Steps panel -->
<section aria-label="Design your tote" style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div role="tablist" aria-label="Steps" style="display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: #EFE9FF">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button class="tab" type="button" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 0; background: {{ t.bg }}; color: {{ t.fg }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{ t.label }}</button>
</sc-for>
</div>

<!-- Step 1 -->
<sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 class="disp" style="margin: 0; font-size: 26px; font-weight: 800">Pick your base</h2>
<div role="group" aria-label="Tote style" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ styles }}" as="s" hint-placeholder-count="2">
<button class="pill" type="button" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 20px; border-radius: 16px; border: {{ s.border }}; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left"><span>{{ s.name }}</span><span style="font-weight: 500; color: #3B2E6B">{{ s.price }}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h3 class="disp" style="margin: 0; font-size: 20px; font-weight: 800">Colour: {{ c.name }}</h3>
<div role="group" aria-label="Tote colour" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ colours }}" as="k" hint-placeholder-count="3">
<button class="pill" type="button" aria-pressed="{{ k.on }}" onClick="{{ k.pick }}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 18px 0 8px; border-radius: 999px; border: {{ k.border }}; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: {{ k.body }}; border: 1px solid #CFC6F2; display: inline-block"></span>{{ k.name }}</button>
</sc-for>
</div>
</div>
<button class="go" type="button" onClick="{{ toStep2 }}" style="align-self: flex-start; min-height: 50px; padding: 0 28px; border-radius: 999px; border: 0; background: #5D1AFA; color: #FDFDFD; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Next: add patches</button>
</div>
</sc-if>

<!-- Step 2 -->
<sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<h2 class="disp" style="margin: 0; font-size: 26px; font-weight: 800">Add your patches</h2>
<p style="margin: 0; font-size: 14px; color: #3B2E6B">{{ maxLabel }}</p>
</div>
<div role="group" aria-label="Patch categories" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ cats }}" as="g" hint-placeholder-count="6">
<button class="pill" type="button" aria-pressed="{{ g.on }}" onClick="{{ g.pick }}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #5D1AFA; background: {{ g.bg }}; color: {{ g.fg }}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{ g.label }}</button>
</sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px">
<sc-for list="{{ library }}" as="l" hint-placeholder-count="10">
<li>
<button class="lib" type="button" onClick="{{ l.add }}" aria-label="Add patch: {{ l.name }}" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 8px 10px; border-radius: 16px; border: 2px solid #EFE9FF; background: #F7F4FF; cursor: pointer; font-family: inherit; color: #1A0B45; box-sizing: border-box">
<img src="{{ l.src }}" alt="" style="width: 70px; height: 62px; object-fit: contain; display: block">
<span style="font-size: 12px; font-weight: 700; line-height: 1.25; text-align: center">{{ l.name }}<br><span style="font-weight: 500; color: #3B2E6B">{{ l.price }}</span></span>
</button>
</li>
</sc-for>
</ul>
<button class="go" type="button" onClick="{{ toStep3 }}" style="align-self: flex-start; min-height: 50px; padding: 0 28px; border-radius: 999px; border: 0; background: #5D1AFA; color: #FDFDFD; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Next: make it yours</button>
</div>
</sc-if>

<!-- Step 3 -->
<sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<h2 class="disp" style="margin: 0; font-size: 26px; font-weight: 800">Make it yours</h2>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 20px; background: #F7F4FF">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 16px"><span style="font-weight: 700">{{ styleName }} · {{ c.name }}</span><span>{{ basePrice }}</span></div>
<sc-for list="{{ lines }}" as="ln" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: #3B2E6B"><span>{{ ln.name }}{{ ln.side }}</span><span>{{ ln.price }}</span></div>
</sc-for>
<div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid #CFC6F2; font-size: 18px; font-weight: 700"><span>Total</span><span>{{ total }}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="tote-notes" style="font-size: 16px; font-weight: 700">Anything we should know?</label>
<textarea id="tote-notes" class="field" rows="3" maxlength="300" value="{{ notes }}" onChange="{{ onNotes }}" placeholder="A deadline, a gift note, anything else..." style="width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; border: 2px solid #CFC6F2; background: #FDFDFD; font-family: inherit; font-size: 16px; line-height: 1.5; color: #1A0B45; resize: vertical"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 20px; background: #E4EE3F">
<p style="margin: 0; font-size: 15px; line-height: 1.5">Send us your design and a screenshot. We'll confirm the price and timing, then press every patch on by hand.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="{{ waLink }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 50px; padding: 0 24px; border-radius: 999px; background: #5D1AFA; color: #FDFDFD; font-size: 16px; font-weight: 700; text-decoration: none">Order on WhatsApp</a>
<a href="cards.html" style="display: inline-flex; align-items: center; min-height: 50px; padding: 0 22px; border-radius: 999px; border: 2px solid #1A0B45; color: #1A0B45; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box">Add a matching card</a>
</div>
</div>
</div>
</sc-if>

<button class="act" type="button" onClick="{{ startOver }}" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: #1A0B45; font-family: inherit; font-size: 15px; font-weight: 700; text-decoration: underline; cursor: pointer">Start over</button>
</section>

</div>
</sc-if>

</main>

<footer style="background: #1A0B45; color: #FDFDFD">
<div style="max-width: 1240px; margin: 0 auto; padding: 56px 5% 40px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="index.html" aria-label="Show and Tell Co home" style="line-height: 0"><img src="images/brand/wordmark-white.png" alt="Show and Tell Co" style="height: 72px; width: auto"></a>
<p style="margin: 0; font-size: 16px; color: #FDFDFD">Pun-filled cards and pick-your-patch totes and tees.</p>
<p style="margin: 0; font-size: 14px; color: #CFC6F2">Patch bar experience in Abuja and Barcelona</p>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 16px">
<a href="cards.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Cards</a>
<a href="build-your-tote.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Build a tote</a>
<a href="patches.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Patches</a>

</div>

</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
// ---------- Your settings ----------
// WhatsApp number in international format, digits only (for example 2348012345678).
var WHATSAPP_NUMBER = '';
// Prices: put numbers in place of null (for example 15000). Totals appear once every price is set.
var CURRENCY = '₦';
var PATCH_PRICE = 9500; // default price per patch; a patch can override it with its own price
var MAX_PATCHES = 10;

var COLOURS = {
  natural: { name: 'Natural', body: '#F6F1E7', handle: '#D9CFBB', stitch: '#CFC3AA', pocket: '#EDE5D6' },
  black: { name: 'Black', body: '#2A2630', handle: '#3E3946', stitch: '#5A5464', pocket: '#34303B' },
  lilac: { name: 'Lilac', body: '#D8CCFF', handle: '#BFAFF5', stitch: '#A897E8', pocket: '#CDBFFA' }
};

COLOURS.trim = { name: 'Natural with black trim', body: '#E2D9CA' };
COLOURS.cream = { name: 'Natural', body: '#E6DAC5' };
COLOURS.white = { name: 'White', body: '#F4F4F2' };

// Each tote is a photo (img) with a shading layer (shade) laid over the patches so folds and light show through.
// area = where patch centres can go, in % of the photo (x1 to x2 across, y1 to y2 down).
var STYLES = [
  { id: 'classic', name: 'Classic tote', price: 80000, colours: ['cream'], img: 'images/products/premium.png', shade: 'images/products/premium-shade.png', area: { x1: 26, x2: 70, y1: 50, y2: 84 } },
  { id: 'pocket', name: 'Premium tote bag', price: null, colours: ['trim'], img: 'images/products/classic.png', shade: 'images/products/classic-shade.png', area: { x1: 22, x2: 78, y1: 52, y2: 82 } },
  // A product with a back view gets a Front / Back switch, and patches can go on either side.
  { id: 'tee', name: 'T-shirt', price: null, colours: ['white'], img: 'images/products/tee-front.png', shade: 'images/products/tee-front-shade.png', area: { x1: 32, x2: 66, y1: 30, y2: 80 },
    back: { img: 'images/products/tee-back.png', shade: 'images/products/tee-back-shade.png', area: { x1: 32, x2: 66, y1: 24, y2: 80 } } }
];

// Positions in PRESETS and SLOTS are written for a generic bag (12-88 across, 36-92 down) and fitted to each tote's area.
function mapPos(style, x, y) {
  var a = style.area;
  var fx = Math.max(0, Math.min(1, (x - 12) / 76));
  var fy = Math.max(0, Math.min(1, (y - 36) / 56));
  return [a.x1 + fx * (a.x2 - a.x1), a.y1 + fy * (a.y2 - a.y1)];
}

// Your patches. price null = the default PATCH_PRICE above; put a number to charge more or less for one patch.
var PATCHES = [
  { id: 'p01', no: '01', name: 'Abuja City Gate', cat: 'Places', price: null, src: 'images/patches/abuja-gate.webp' },
  { id: 'p02', no: '02', name: 'Plantain', cat: 'Food', price: null, src: 'images/patches/plantain.webp' },
  { id: 'p03', no: '03', name: 'Meat pie', cat: 'Food', price: null, src: 'images/patches/meat-pie.webp' },
  { id: 'p04', no: '04', name: 'Jollof and chicken', cat: 'Food', price: null, src: 'images/patches/jollof.webp' },
  { id: 'p05', no: '05', name: 'Danfo, full house', cat: 'Rides', price: null, src: 'images/patches/danfo-busy.webp' },
  { id: 'p06', no: '06', name: 'Danfo', cat: 'Rides', price: null, src: 'images/patches/danfo.webp' },
  { id: 'p07', no: '07', name: 'Keke', cat: 'Rides', price: null, src: 'images/patches/keke.webp' },
  { id: 'p08', no: '08', name: 'National Theatre', cat: 'Places', price: null, src: 'images/patches/national-theatre.webp' },
  { id: 'p09', no: '09', name: 'Drums', cat: 'Culture', price: null, src: 'images/patches/drums.webp' },
  { id: 'p10', no: '10', name: 'Gala', cat: 'Snacks & drinks', price: null, src: 'images/patches/gala.webp' },
  { id: 'p11', no: '11', name: 'Green passport', cat: 'Culture', price: null, src: 'images/patches/passport.webp' },
  { id: 'p12', no: '12', name: 'Puff-puff', cat: 'Snacks & drinks', price: null, src: 'images/patches/puff-puff.webp' },
  { id: 'p13', no: '13', name: 'Pure water', cat: 'Snacks & drinks', price: null, src: 'images/patches/pure-water.webp' },
  { id: 'p14', no: '14', name: 'Suya', cat: 'Food', price: null, src: 'images/patches/suya.webp' },
  { id: 'p15', no: '15', name: 'Palm wine', cat: 'Snacks & drinks', price: null, src: 'images/patches/palm-wine.webp' },
  { id: 'p16', no: '16', name: 'Show and Tell logo', cat: 'Show & Tell', price: null, src: 'images/patches/show-and-tell.webp' },
  { id: 'p17', no: '17', name: 'SuperYogo', cat: 'Snacks & drinks', price: null, src: 'images/patches/superyogo.webp' },
  { id: 'p18', no: '18', name: 'Zuma Rock', cat: 'Places', price: null, src: 'images/patches/zuma-rock.webp' },
  { id: 'p19', no: '19', name: 'Wahala', cat: 'Sayings', price: null, src: 'images/patches/wahala.webp' },
  { id: 'p20', no: '20', name: 'Abuja stamp', cat: 'Places', price: null, src: 'images/patches/abuja-stamp.webp' },
  { id: 'p21', no: '21', name: 'No gree for anybody', cat: 'Sayings', price: null, src: 'images/patches/no-gree.webp' },
  { id: 'p22', no: '22', name: 'Lagos stamp', cat: 'Places', price: null, src: 'images/patches/lagos-stamp.webp' },
  { id: 'p23', no: '23', name: 'Nollywood', cat: 'Culture', price: null, src: 'images/patches/nollywood.webp' }
];

// Ready-made mixes for "Start from a favourite". x and y are % of the bag, s is size 0-4, r is rotation.
var PRESETS = [
  { id: 'lagos', name: 'Lagos life', style: 'classic', colour: 'natural', items: [
    { pid: 'p06', x: 34, y: 48, s: 2, r: -6 }, { pid: 'p07', x: 68, y: 52, s: 2, r: 6 },
    { pid: 'p13', x: 36, y: 78, s: 2, r: 4 }, { pid: 'p12', x: 68, y: 82, s: 2, r: -4 } ] },
  { id: 'owambe', name: 'Owambe plate', style: 'pocket', colour: 'natural', items: [
    { pid: 'p04', x: 32, y: 50, s: 2, r: -5 }, { pid: 'p14', x: 68, y: 50, s: 2, r: 6 },
    { pid: 'p09', x: 36, y: 80, s: 2, r: 4 }, { pid: 'p15', x: 68, y: 82, s: 2, r: -6 } ] },
  { id: 'abuja', name: 'Abuja, with love', style: 'tee', colour: 'white', items: [
    { pid: 'p01', x: 32, y: 46, s: 2, r: -5 }, { pid: 'p18', x: 68, y: 50, s: 2, r: 5 },
    { pid: 'p11', x: 34, y: 80, s: 2, r: 6 }, { pid: 'p16', x: 68, y: 82, s: 2, r: -4 } ] }
];

var SIZES = [14, 19, 25, 31, 38];
var SLOTS = [[50, 55], [32, 68], [68, 68], [50, 82], [30, 48], [70, 48], [36, 86], [64, 86], [50, 40], [50, 68]];
var CATS = ['All', 'Food', 'Snacks & drinks', 'Rides', 'Places', 'Culture', 'Sayings', 'Show & Tell'];
// ---------- End of settings ----------

function money(n) { return n == null ? '[PRICE]' : CURRENCY + Number(n).toLocaleString('en-GB'); }
function patchInfo(pid) { return PATCHES.find(function (p) { return p.id === pid; }); }
function patchPrice(info) { return info.price != null ? info.price : PATCH_PRICE; }
function styleInfo(id) { return STYLES.find(function (s) { return s.id === id; }) || STYLES[0]; }
function face(style, side) { return side === 'back' && style.back ? style.back : style; }
function totalFor(styleId, items) {
  var base = styleInfo(styleId).price;
  if (base == null) return null;
  var sum = base;
  for (var i = 0; i < items.length; i++) {
    var pp = patchPrice(patchInfo(items[i].pid));
    if (pp == null) return null;
    sum += pp;
  }
  return sum;
}
function totalLabel(n) { return n == null ? '[TOTAL]' : money(n); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.uid = 0;
    this.moved = false;
    this.state = { mode: 'start', step: 1, style: 'classic', colour: 'natural', side: 'front', cat: 'All', placed: [], sel: null, drag: null, hist: [], notes: '' };
  }

  nextId() { this.uid += 1; return this.uid; }

  commit(placed, extra) {
    var hist = this.state.hist.concat([this.state.placed]).slice(-40);
    this.setState(Object.assign({ placed: placed, hist: hist }, extra || {}));
  }

  change(uid, fn) {
    this.commit(this.state.placed.map(function (p) { return p.uid === uid ? fn(p) : p; }));
  }

  curFace() { return face(styleInfo(this.state.style), this.state.side); }
  curSide() { return styleInfo(this.state.style).back ? this.state.side : 'front'; }
  clampX(x) { var a = this.curFace().area; return Math.max(a.x1, Math.min(a.x2, x)); }
  clampY(y) { var a = this.curFace().area; return Math.max(a.y1, Math.min(a.y2, y)); }

  renderVals() {
    var self = this;
    var st = this.state;
    var style = styleInfo(st.style);
    var colourId = style.colours.indexOf(st.colour) >= 0 ? st.colour : style.colours[0];
    var c = COLOURS[colourId];
    var selItem = st.placed.find(function (p) { return p.uid === st.sel; });
    var full = st.placed.length >= MAX_PATCHES;
    var side = style.back ? st.side : 'front';
    var fc = face(style, side);

    var stepNames = ['Pick your base', 'Add your patches', 'Make it yours'];
    var activeStep = st.mode === 'start' ? 1 : st.step;
    var stepDots = stepNames.map(function (label, i) {
      var on = i + 1 === activeStep;
      return { n: i + 1, label: label, bg: on ? '#5D1AFA' : '#EFE9FF', fg: on ? '#FDFDFD' : '#1A0B45', numBg: on ? '#E4EE3F' : '#FDFDFD', numFg: '#1A0B45' };
    });

    var presets = PRESETS.map(function (pr) {
      var ps = styleInfo(pr.style);
      var items = pr.items.map(function (it) {
        var pos = mapPos(ps, it.x, it.y);
        return { src: patchInfo(it.pid).src, x: pos[0], y: pos[1], w: SIZES[it.s], r: it.r };
      });
      return {
        name: pr.name, img: ps.img, shade: ps.shade, items: items,
        meta: ps.name + ' · ' + pr.items.length + ' patches',
        total: totalLabel(totalFor(pr.style, pr.items)),
        use: function () {
          var placed = pr.items.map(function (it) { var pos = mapPos(ps, it.x, it.y); return Object.assign({ uid: self.nextId() }, it, { x: pos[0], y: pos[1], side: 'front' }); });
          self.setState({ mode: 'build', step: 2, style: pr.style, colour: ps.colours[0], side: 'front', placed: placed, sel: null, hist: [], notes: '' });
        }
      };
    });

    var blanks = STYLES.map(function (s) {
      return {
        name: s.name, img: s.img, price: money(s.price),
        meta: s.colours.length + (s.colours.length === 1 ? ' colour' : ' colours') + (s.back ? ' · patches front and back' : ''),
        use: function () { self.setState({ mode: 'build', step: 1, style: s.id, colour: s.colours[0], side: 'front', placed: [], sel: null, hist: [], notes: '' }); }
      };
    });

    var placed = st.placed.filter(function (p) { return (p.side || 'front') === side; }).map(function (p) {
      var info = patchInfo(p.pid);
      return {
        x: p.x, y: p.y, w: SIZES[p.s], r: p.r, src: info.src,
        label: 'Patch: ' + info.name + '. Drag to move, or use the arrow keys.',
        ring: p.uid === st.sel ? '2px dashed #5D1AFA' : '0px solid transparent',
        down: function (e) { e.preventDefault(); self.moved = false; self.setState({ drag: p.uid, sel: p.uid }); },
        select: function () { self.setState({ sel: p.uid }); },
        key: function (e) {
          var d = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
          if (!d) return;
          e.preventDefault();
          self.setState({ sel: p.uid });
          self.change(p.uid, function (q) { return Object.assign({}, q, { x: self.clampX(q.x + d[0]), y: self.clampY(q.y + d[1]) }); });
        }
      };
    });

    var tabs = ['1. Base', '2. Patches', '3. Finish'].map(function (label, i) {
      var on = st.step === i + 1;
      return { label: label, on: on ? 'true' : 'false', bg: on ? '#5D1AFA' : 'transparent', fg: on ? '#FDFDFD' : '#1A0B45', pick: function () { self.setState({ step: i + 1 }); } };
    });

    var styles = STYLES.map(function (s) {
      var on = s.id === st.style;
      return {
        name: s.name, price: money(s.price), on: on ? 'true' : 'false',
        border: on ? '2px solid #5D1AFA' : '2px solid #CFC6F2',
        pick: function () { self.setState({ style: s.id, side: 'front', sel: null, colour: s.colours.indexOf(st.colour) >= 0 ? st.colour : s.colours[0] }); }
      };
    });

    var colours = style.colours.map(function (id) {
      var k = COLOURS[id];
      var on = id === colourId;
      return { name: k.name, body: k.body, on: on ? 'true' : 'false', border: on ? '2px solid #5D1AFA' : '2px solid #CFC6F2', pick: function () { self.setState({ colour: id }); } };
    });

    var cats = CATS.map(function (g) {
      var on = g === st.cat;
      return { label: g, on: on ? 'true' : 'false', bg: on ? '#5D1AFA' : '#FDFDFD', fg: on ? '#FDFDFD' : '#5D1AFA', pick: function () { self.setState({ cat: g }); } };
    });

    var library = PATCHES.filter(function (info) { return st.cat === 'All' || info.cat === st.cat; }).map(function (info) {
      return {
        no: info.no, name: info.name, src: info.src, price: money(patchPrice(info)),
        add: function () {
          var list = self.state.placed;
          if (list.length >= MAX_PATCHES) return;
          var slot = SLOTS[list.length % SLOTS.length];
          var pos = mapPos(self.curFace(), slot[0], slot[1]);
          var item = { uid: self.nextId(), pid: info.id, x: pos[0], y: pos[1], s: 2, r: 0, side: self.curSide() };
          self.commit(list.concat([item]), { sel: item.uid });
        }
      };
    });

    var lines = st.placed.map(function (p) {
      var info = patchInfo(p.pid);
      return { no: info.no, name: info.name, price: money(patchPrice(info)), side: style.back ? (p.side === 'back' ? ' (back)' : ' (front)') : '' };
    });

    var names = st.placed.map(function (p) { var i = patchInfo(p.pid); return i.name + (style.back ? (p.side === 'back' ? ' (back)' : ' (front)') : ''); });
    var sides = ['front', 'back'].map(function (sd) {
      var on = sd === side;
      var n = st.placed.filter(function (p) { return (p.side || 'front') === sd; }).length;
      return { label: (sd === 'front' ? 'Front' : 'Back') + (n ? ' (' + n + ')' : ''), on: on ? 'true' : 'false', bg: on ? '#5D1AFA' : 'transparent', fg: on ? '#FDFDFD' : '#1A0B45', pick: function () { self.setState({ side: sd, sel: null }); } };
    });
    var total = totalLabel(totalFor(style.id, st.placed));
    var msg = "Hi Show and Tell! I'd like a " + style.name + ' in ' + c.name + ' with ' + st.placed.length
      + (st.placed.length === 1 ? ' patch: ' : ' patches: ') + (names.length ? names.join(', ') : 'none yet') + '.'
      + (st.notes.trim() ? ' Notes: ' + st.notes.trim() : '')
      + " I'll send a screenshot of my layout.";

    return {
      isStart: st.mode === 'start', isBuild: st.mode === 'build',
      stepDots: stepDots, presets: presets, blanks: blanks,
      c: c, bagImg: fc.img, bagShade: fc.shade, bagAlt: style.name + ', ' + c.name + (style.back ? ', ' + side : ''), hasBack: !!style.back, sides: sides, styleName: style.name, basePrice: money(style.price),
      placed: placed, tabs: tabs, styles: styles, colours: colours, cats: cats, library: library, lines: lines,
      s1: st.step === 1, s2: st.step === 2, s3: st.step === 3,
      noSel: !selItem, noDup: !selItem || full, noUndo: st.hist.length === 0,
      countLabel: st.placed.length + (st.placed.length === 1 ? ' patch' : ' patches') + ' on your ' + style.name.toLowerCase(),
      maxLabel: st.placed.length + ' of ' + MAX_PATCHES + ' added',
      hint: full ? 'Your design is full. Remove a patch to add another.' : (st.placed.length ? 'Drag patches to move them. Tap one to edit it.' : 'Ready for patches.'),
      total: total, notes: st.notes,
      waLink: 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg),
      toStep2: function () { self.setState({ step: 2 }); },
      toStep3: function () { self.setState({ step: 3, sel: null }); },
      onNotes: function (e) { self.setState({ notes: e.target.value }); },
      startOver: function () { self.setState({ mode: 'start', step: 1, side: 'front', placed: [], sel: null, hist: [], notes: '' }); },
      onBgDown: function (e) { if (!e.target.closest || !e.target.closest('button')) self.setState({ sel: null }); },
      onMove: function (e) {
        var id = self.state.drag;
        if (id == null) return;
        var r = e.currentTarget.getBoundingClientRect();
        var x = self.clampX((e.clientX - r.left) / r.width * 100);
        var y = self.clampY((e.clientY - r.top) / r.height * 100);
        var next = self.state.placed.map(function (q) { return q.uid === id ? Object.assign({}, q, { x: x, y: y }) : q; });
        if (!self.moved) { self.moved = true; self.commit(next); } else { self.setState({ placed: next }); }
      },
      onUp: function () { if (self.state.drag != null) self.setState({ drag: null }); },
      undo: function () {
        var h = self.state.hist;
        if (!h.length) return;
        self.setState({ placed: h[h.length - 1], hist: h.slice(0, -1), sel: null });
      },
      rotL: function () { self.change(self.state.sel, function (q) { return Object.assign({}, q, { r: q.r - 15 }); }); },
      rotR: function () { self.change(self.state.sel, function (q) { return Object.assign({}, q, { r: q.r + 15 }); }); },
      smaller: function () { self.change(self.state.sel, function (q) { return Object.assign({}, q, { s: Math.max(0, q.s - 1) }); }); },
      bigger: function () { self.change(self.state.sel, function (q) { return Object.assign({}, q, { s: Math.min(SIZES.length - 1, q.s + 1) }); }); },
      front: function () {
        var id = self.state.sel; var it = self.state.placed.find(function (q) { return q.uid === id; });
        self.commit(self.state.placed.filter(function (q) { return q.uid !== id; }).concat([it]));
      },
      back: function () {
        var id = self.state.sel; var it = self.state.placed.find(function (q) { return q.uid === id; });
        self.commit([it].concat(self.state.placed.filter(function (q) { return q.uid !== id; })));
      },
      dup: function () {
        var it = self.state.placed.find(function (q) { return q.uid === self.state.sel; });
        if (!it || self.state.placed.length >= MAX_PATCHES) return;
        var copy = Object.assign({}, it, { uid: self.nextId(), x: self.clampX(it.x + 6), y: self.clampY(it.y + 6) });
        self.commit(self.state.placed.concat([copy]), { sel: copy.uid });
      },
      remove: function () {
        var id = self.state.sel;
        self.commit(self.state.placed.filter(function (q) { return q.uid !== id; }), { sel: null });
      }
    };
  }
}

DCLite.mount(Component);
</script>
