<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal · Show and Tell Co</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jost-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/home.css">
<style>
/* Staff portal. Staff sign in with the shared code (PORTAL_CODE in Netlify); every action is checked
   on the server by netlify/functions/portal-*.mjs. The first tool here is Receipts. */
.pt p { margin: 0; }
.pt-wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; box-sizing: border-box; }
.pt [hidden] { display: none !important; }

/* Sign in */
.pt-login { max-width: 440px; margin: 56px auto 100px; padding: 40px 36px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 24px 50px rgba(26, 11, 69, 0.12); text-align: center; }
.pt-login h2 { margin: 0; font-size: 28px; color: #1A0B45; }
.pt-login p { margin-top: 10px !important; font-size: 16px; color: #4A3F6B; }
.pt-login form { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }

/* Fields */
.pt-field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.pt-field > label, .pt-legend { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1A0B45; }
.pt-field .opt { font-weight: 500; letter-spacing: 0; text-transform: none; color: #6B6B68; }
.pt input[type=text], .pt input[type=email], .pt input[type=tel], .pt input[type=password], .pt input[type=number], .pt select, .pt textarea {
  width: 100%; min-height: 48px; padding: 0 13px; border: 1.5px solid #CFC6F2; border-radius: 10px; background: #FFFFFF;
  font-family: inherit; font-size: 16px; color: #1A0B45; box-sizing: border-box; }
.pt textarea { min-height: 90px; padding: 11px 13px; line-height: 1.5; resize: vertical; }
.pt input:focus, .pt select:focus, .pt textarea:focus { outline: 2px solid #5D1AFA; outline-offset: 1px; border-color: #5D1AFA; }
.pt-error { font-size: 15px; color: #C2306F; }
.pt-error:empty { display: none; }
.home .pt-go { width: 100%; background: #1A0B45; color: #F6F1E7; border: 0; cursor: pointer; }
.home .pt-go:hover { background: #5D1AFA; color: #FFFFFF; }
.home .pt-go[disabled] { opacity: 0.6; cursor: default; }

/* Signed in */
.pt-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 30px 0 6px; }
.pt-tabs { display: flex; align-items: center; gap: 12px; }
.pt-tabs span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 999px; background: #1A0B45; color: #FFFFFF; font-size: 15px; font-weight: 600; }
.pt-back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px 0 12px; border-radius: 999px; background: #F4F0FF; color: #3B2E6B; font-size: 15px; font-weight: 600; text-decoration: none; }
.pt-back:hover { background: #E9E2FF; color: #1A0B45; }
.pt-hello { font-size: 18px; color: #1A0B45; }
.pt-out { border: 0; background: none; font: inherit; font-size: 15px; color: #4A3F6B; text-decoration: underline; cursor: pointer; }

/* Portal home: one tile per tool */
.pt-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; padding: 22px 0 110px; }
.pt-tool { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 26px 24px 24px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(26, 11, 69, 0.08); color: #1A0B45; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
a.pt-tool:hover { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(26, 11, 69, 0.14); }
a.pt-tool:focus-visible { outline: 3px solid #5D1AFA; outline-offset: 3px; }
.pt-tool-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: #5D1AFA; color: #E4EE3F; }
.pt-tool-icon svg { width: 34px; height: 34px; }
.pt-tool b { font-size: 21px; line-height: 1.15; }
.pt-tool small { font-size: 15px; line-height: 1.45; color: #4A3F6B; }
.pt-tool .go { margin-top: auto; padding-top: 6px; font-size: 15px; font-weight: 600; color: #5D1AFA; }
.pt-tool.is-soon { background: transparent; border: 2px dashed #CFC6F2; box-shadow: none; }
.pt-tool.is-soon .pt-tool-icon { background: #F4F0FF; color: #9B8FD0; }
.pt-tool.is-soon b { color: #6B6B68; }
.pt-main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: start; padding: 20px 0 50px; }
.pt-card { padding: 28px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(26, 11, 69, 0.08); }
.pt-card h2 { margin: 0 0 18px; font-size: 24px; color: #1A0B45; }
.pt-form { display: flex; flex-direction: column; gap: 18px; }
.pt-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.pt-seg { display: inline-flex; padding: 4px; border-radius: 999px; background: #F4F0FF; align-self: flex-start; }
.pt-seg label { position: relative; }
.pt-seg input { position: absolute; opacity: 0; }
.pt-seg span { display: inline-flex; align-items: center; min-height: 38px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #3B2E6B; cursor: pointer; }
.pt-seg input:checked + span { background: #5D1AFA; color: #FFFFFF; }
.pt-seg input:focus-visible + span { outline: 2px solid #1A0B45; }

.pt-items { display: flex; flex-direction: column; gap: 10px; }
.pt-row { display: grid; grid-template-columns: minmax(0, 1fr) 74px 120px 40px; gap: 8px; align-items: center; }
.pt-row-head { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1A0B45; }
.pt-row .line { grid-column: 1 / -1; margin-top: -4px; font-size: 13px; color: #6B6B68; }
.pt-x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #F4F0FF; color: #3B2E6B; font-size: 20px; line-height: 1; cursor: pointer; }
.pt-x:hover { background: #E9E2FF; }
.pt-add { align-self: flex-start; min-height: 40px; padding: 0 16px; border: 1.5px dashed #CFC6F2; border-radius: 999px; background: none; font: inherit; font-size: 15px; font-weight: 600; color: #5D1AFA; cursor: pointer; }
.pt-add:hover { border-color: #5D1AFA; }

/* The preview: how the customer's email will look */
.pt-preview { position: sticky; top: 16px; }
.pt-rc { overflow: hidden; border-radius: 18px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(26, 11, 69, 0.1); font-family: Helvetica, Arial, sans-serif; color: #1A0B45; }
.pt-rc-top { padding: 26px 28px 20px; background: #5D1AFA; }
.pt-rc-top small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #E4EE3F; }
.pt-rc-top b { display: block; margin-top: 8px; font-size: 24px; color: #FFFFFF; }
.pt-rc-body { padding: 22px 28px 26px; font-size: 15px; line-height: 1.45; }
.pt-rc-meta { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 6px; font-size: 13px; color: #6B6B68; }
.pt-rc-meta b { display: block; font-size: 15px; color: #1A0B45; }
.pt-rc table { width: 100%; border-collapse: collapse; }
.pt-rc td { padding: 9px 0; border-bottom: 1px solid #EEEAF6; vertical-align: top; }
.pt-rc td small { display: block; font-size: 13px; color: #6B6B68; }
.pt-rc td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
.pt-rc .sum td { border: 0; padding: 5px 0; }
.pt-rc .sum .total td { font-size: 17px; font-weight: 700; }
.pt-rc-status { margin-top: 14px; padding: 11px 13px; border-radius: 10px; background: #F4F0FF; font-size: 14px; }
.pt-rc-note { margin-top: 14px !important; font-size: 14px; color: #3B2E6B; white-space: pre-line; }
.pt-preview-label { margin: 0 0 10px !important; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B68; }

/* Confirming before a receipt goes out (on the page, since some browsers block pop-ups) */
.pt-confirm { padding: 16px; border-radius: 14px; background: #F4F0FF; }
.pt-confirm p { font-size: 16px; color: #1A0B45; }
.pt-confirm-btns { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.pt-confirm-btns .pt-go { width: auto; padding: 0 26px; }
.pt-cancel { border: 0; background: none; font: inherit; font-size: 15px; color: #4A3F6B; text-decoration: underline; cursor: pointer; }
.pt-row-msg { display: block; margin-top: 4px; font-size: 13px; color: #7A4A00; }
.pt-done { padding: 14px 16px; border-radius: 12px; background: #EAF7EE; font-size: 15px; color: #14532D; }
.pt-done.is-warn { background: #FFF4E5; color: #7A4A00; }

/* Recent receipts */
.pt-list { padding: 0 0 100px; }
.pt-list h2 { margin: 0 0 14px; font-size: 24px; color: #1A0B45; }
.pt-table { width: 100%; border-collapse: collapse; background: #FFFFFF; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 26px rgba(26, 11, 69, 0.06); font-size: 15px; }
.pt-table th { padding: 12px 14px; background: #F4F0FF; text-align: left; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #3B2E6B; }
.pt-table td { padding: 12px 14px; border-top: 1px solid #EEEAF6; vertical-align: middle; }
.pt-table .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #F4F0FF; font-size: 12px; font-weight: 600; }
.pt-table .tag.ok { background: #EAF7EE; color: #14532D; }
.pt-table .tag.no { background: #FFF4E5; color: #7A4A00; }
.pt-table button { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #5D1AFA; text-decoration: underline; cursor: pointer; }
.pt-empty { padding: 26px; border-radius: 14px; background: #F4F0FF; color: #3B2E6B; }

/* Inventory */
.pt-inv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 18px 0 16px; }
.pt-inv-top input[type=search], .pt-inv-top input[type=text] { width: auto; flex: 1 1 220px; min-height: 46px; padding: 0 13px; border: 1.5px solid #CFC6F2; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1A0B45; box-sizing: border-box; }
.pt-inv-top .pt-seg { flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.pt-inv-top .pt-seg span { white-space: nowrap; padding: 0 14px; }
.pt-inv-stats { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 22px; }
.pt-inv-stats span { padding: 8px 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(26, 11, 69, 0.06); font-size: 15px; color: #3B2E6B; }
.pt-inv-stats b { color: #1A0B45; }
.pt-inv-stats .is-low b { color: #B4235A; }
.pt-inv-list { overflow: hidden; border-radius: 14px; background: #FFFFFF; box-shadow: 0 10px 26px rgba(26, 11, 69, 0.06); }
.inv-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; align-items: center; gap: 8px 16px; padding: 12px 16px; border-top: 1px solid #EEEAF6; }
.inv-row:first-child { border-top: 0; }
.inv-row.is-low { background: #FFF6F9; }
.inv-name b { display: block; font-size: 16px; font-weight: 600; color: #1A0B45; }
.inv-name small { display: block; margin-top: 2px; font-size: 13px; color: #6B6B68; }
.inv-tag { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 999px; background: #FDE2EC; font-size: 12px; font-weight: 700; color: #B4235A; vertical-align: 2px; }
.inv-count { font-size: 24px; font-weight: 700; text-align: right; color: #1A0B45; font-variant-numeric: tabular-nums; }
.inv-count.none { font-size: 15px; font-weight: 500; color: #9B95AE; }
.inv-row.is-low .inv-count { color: #B4235A; }
.inv-btns { display: flex; align-items: center; gap: 6px; }
.inv-btns button { min-width: 40px; height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: #F4F0FF; font: inherit; font-size: 15px; font-weight: 600; color: #3B2E6B; cursor: pointer; }
.inv-btns button:hover { background: #E9E2FF; }
.inv-btns .pm { font-size: 20px; line-height: 1; padding: 0; }
.inv-btns button[disabled] { opacity: 0.5; cursor: default; }
.inv-edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 14px; border-radius: 12px; background: #F4F0FF; }
.inv-edit .pt-field { flex: 0 1 130px; }
.inv-edit .pt-field.wide-f { flex: 1 1 200px; }
.inv-edit .pt-go { width: auto; padding: 0 22px; }
.inv-edit .pt-error { flex-basis: 100%; }
.inv-stop { margin-left: auto; }
.inv-more { display: block; width: 100%; padding: 14px; border: 0; border-top: 1px solid #EEEAF6; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #5D1AFA; cursor: pointer; }
.pt-inv-log { padding: 34px 0 100px; }
.pt-inv-log h2 { margin: 0 0 14px; font-size: 24px; color: #1A0B45; }
.pt-table .up { color: #14532D; font-weight: 700; }
.pt-table .down { color: #B4235A; font-weight: 700; }

@media (max-width: 900px) {
  .pt-wrap { padding: 0 16px; }
  .pt-main { grid-template-columns: minmax(0, 1fr); }
  .pt-preview { position: static; }
  .pt-card { padding: 20px 16px; }
  .pt-table thead { display: none; }
  .pt-table tr { display: grid; grid-template-columns: 1fr auto; padding: 10px 14px; border-top: 1px solid #EEEAF6; }
  .pt-table td { padding: 3px 0; border: 0; }
  .inv-row { grid-template-columns: minmax(0, 1fr) auto; }
  .inv-btns { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .pt-two { grid-template-columns: minmax(0, 1fr); }
  /* Phones: the product gets its own line, with quantity and price under it */
  .pt-row { grid-template-columns: 80px minmax(0, 1fr) 36px; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #EEEAF6; }
  .pt-row [data-k=product] { grid-column: 1 / -1; }
  .pt-row-head { display: none; }
  .pt-x { width: 36px; height: 36px; }
}
</style>
</head>
<body class="home">
<header><div id="site-header"></div></header>
<script src="assets/header.js"></script>

<main class="pt">
  <section class="st-hero" aria-labelledby="pt-title">
    <div class="st-hero-inner">
      <h1 id="pt-title"><span>Staff</span>Portal</h1>
      <p>For the Show and Tell team. Send receipts, keep track of stock, and more tools on the way.</p>
    </div>
  </section>

  <!-- Sign in -->
  <div class="pt-wrap" id="pt-signin">
    <div class="pt-login">
      <h2 class="wide">Sign in</h2>
      <p>Enter the staff code to open the portal.</p>
      <form id="pt-login-form" autocomplete="off">
        <div class="pt-field"><label for="pt-code" class="cl-sr" style="position:absolute;left:-9999px">Staff code</label><input id="pt-code" type="password" placeholder="Staff code" autocomplete="current-password" required></div>
        <p class="pt-error" id="pt-login-error" role="alert"></p>
        <button class="btn pt-go" type="submit">Open the portal</button>
      </form>
    </div>
  </div>

  <!-- Signed in -->
  <div class="pt-wrap" id="pt-app" hidden>
    <div class="pt-bar">
      <div class="pt-tabs" id="pt-tabs"></div>
      <button class="pt-out" type="button" id="pt-signout">Sign out</button>
    </div>

    <!-- Portal home: every tool, as a tile. Add new tools to TOOLS in the script below. -->
    <div class="pt-tools" id="pt-home"></div>

    <div id="pt-tool-receipts" hidden>
    <div class="pt-main">
      <section class="pt-card" aria-labelledby="pt-new-h">
        <h2 id="pt-new-h" class="wide">New receipt</h2>
        <form class="pt-form" id="pt-form" novalidate>
          <div class="pt-two">
            <div class="pt-field"><label for="r-name">Customer name</label><input id="r-name" type="text" maxlength="80" autocomplete="off"></div>
            <div class="pt-field"><label for="r-email">Customer email</label><input id="r-email" type="email" maxlength="200" autocomplete="off"></div>
          </div>
          <div class="pt-two">
            <div class="pt-field"><label for="r-phone">Phone <span class="opt">(optional)</span></label><input id="r-phone" type="tel" maxlength="40" autocomplete="off"></div>
            <div class="pt-field"><span class="pt-legend">Currency</span>
              <div class="pt-seg" role="radiogroup" aria-label="Currency">
                <label><input type="radio" name="currency" value="NGN" checked><span>₦ Naira</span></label>
                <label><input type="radio" name="currency" value="EUR"><span>€ Euro</span></label>
              </div>
            </div>
          </div>

          <div class="pt-field">
            <div class="pt-row pt-row-head" aria-hidden="true"><span>Product</span><span>Qty</span><span>Price each</span><span></span></div>
            <div class="pt-items" id="pt-items"></div>
            <button class="pt-add" type="button" id="pt-add">+ Add another product</button>
            <datalist id="pt-products"></datalist>
          </div>

          <div class="pt-two">
            <div class="pt-field"><label for="r-delivery">Delivery <span class="opt">(optional)</span></label><input id="r-delivery" type="number" min="0" step="any" inputmode="decimal"></div>
            <div class="pt-field"><label for="r-discount">Discount <span class="opt">(optional)</span></label><input id="r-discount" type="number" min="0" step="any" inputmode="decimal"></div>
          </div>
          <div class="pt-two">
            <div class="pt-field"><label for="r-payment">Payment</label><select id="r-payment"><option>Paid</option><option>Part paid</option><option>Not paid yet</option></select></div>
            <div class="pt-field"><label for="r-method">Paid by</label><select id="r-method"><option value="">Not saying</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Paystack</option><option>Stripe</option><option>Other</option></select></div>
          </div>
          <div class="pt-field" id="r-paid-wrap" hidden><label for="r-paid">Amount paid so far</label><input id="r-paid" type="number" min="0" step="any" inputmode="decimal"></div>
          <div class="pt-field"><label for="r-note">Note on the receipt <span class="opt">(optional)</span></label><textarea id="r-note" maxlength="600" placeholder="A thank-you, delivery details, or how to pay the balance"></textarea></div>
          <div class="pt-field"><label for="r-staff">Made by <span class="opt">(optional, only staff see this)</span></label><input id="r-staff" type="text" maxlength="60" autocomplete="off"></div>

          <p class="pt-error" id="pt-form-error" role="alert"></p>
          <div class="pt-done" id="pt-done" hidden aria-live="polite"></div>
          <button class="btn pt-go" type="submit" id="pt-send">Send receipt</button>
          <div class="pt-confirm" id="pt-confirm" hidden role="alertdialog" aria-labelledby="pt-confirm-q">
            <p id="pt-confirm-q"></p>
            <div class="pt-confirm-btns"><button class="btn pt-go" type="button" id="pt-yes">Yes, send it</button><button class="pt-cancel" type="button" id="pt-no">Cancel</button></div>
          </div>
        </form>
      </section>

      <aside class="pt-preview" aria-label="Receipt preview">
        <p class="pt-preview-label">What the customer gets</p>
        <div class="pt-rc" id="pt-rc"></div>
      </aside>
    </div>

    <section class="pt-list" aria-labelledby="pt-list-h">
      <h2 id="pt-list-h" class="wide">Recent receipts</h2>
      <div id="pt-list"></div>
    </section>
    </div>

    <div id="pt-tool-inventory" hidden>
      <div class="pt-inv-stats" id="inv-stats" aria-live="polite"></div>
      <div class="pt-inv-top">
        <label for="inv-q" style="position:absolute;left:-9999px">Find a product</label>
        <input id="inv-q" type="search" placeholder="Find a product" autocomplete="off">
        <div class="pt-seg" role="radiogroup" aria-label="Show">
          <label><input type="radio" name="inv-show" value="all" checked><span>All</span></label>
          <label><input type="radio" name="inv-show" value="low"><span>Low</span></label>
          <label><input type="radio" name="inv-show" value="counted"><span>Counted</span></label>
          <label><input type="radio" name="inv-show" value="none"><span>Not counted</span></label>
        </div>
        <label for="inv-who" style="position:absolute;left:-9999px">Your name</label>
        <input id="inv-who" type="text" maxlength="60" placeholder="Your name (for the history)" autocomplete="off">
      </div>
      <p class="pt-error" id="inv-error" role="alert"></p>
      <div class="pt-inv-list" id="inv-list"></div>
      <section class="pt-inv-log" aria-labelledby="inv-log-h">
        <h2 id="inv-log-h" class="wide">Stock history</h2>
        <div id="inv-log"></div>
      </section>
    </div>
  </div>
</main>

<footer class="home-footer" id="site-footer"></footer>
<script src="assets/footer.js"></script>
<script src="assets/prices.js"></script>
<script src="assets/catalog.js"></script>
<script>
(function () {
  var KEY = 'stc-portal-code';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function code() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function api(path, opts) {
    opts = opts || {};

  // ---------- Recent receipts ----------

  // ---------- Inventory ----------
  // Products are named like on receipts, so receipts take them off the count. A product is
  // "counted" once someone sets its stock; the rest show as "Not counted".
  var STOCK = { items: {}, log: [] }, invOpen = null, invShown = 60, invQueue = Promise.resolve();
  try { $('inv-who').value = localStorage.getItem('stc-portal-name') || ''; } catch (e) {}
  $('inv-who').addEventListener('change', function () { try { localStorage.setItem('stc-portal-name', this.value.trim()); } catch (e) {} });
  function isLow(it) { return it && (it.count <= 0 || (it.low != null && it.count <= it.low)); }
  function shortDate(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function loadStock() {
    $('inv-error').textContent = '';
    api('/api/portal/inventory').then(function (res) {
      if (signedOut(res)) return;
      if (!res.items) { $('inv-error').textContent = res.message || 'Couldn’t load the stock just now.'; return; }
      STOCK = res; drawStock();
    }).catch(function () { $('inv-error').textContent = 'Couldn’t load the stock just now. Check your connection.'; });
  }
  // Changes go one at a time, so quick taps on + and − all count.
  function changeStock(body, done) {
    body.staff = $('inv-who').value.trim();
    invQueue = invQueue.then(function () {
      return api('/api/portal/inventory', { method: 'POST', body: body }).then(function (res) {
        if (signedOut(res)) return;
        if (!res.items) { if (done) done(res.message || 'That didn’t work. Please try again.'); return; }
        STOCK = res; if (done) done(null); drawStock();

    });
  }
  function drawStock() {
    var items = STOCK.items, names = {};
    Object.keys(PRODUCTS).forEach(function (k) { names[k] = 1; });
    Object.keys(items).forEach(function (k) { names[k] = 1; });
    var all = Object.keys(names), counted = all.filter(function (k) { return items[k]; }), low = counted.filter(function (k) { return isLow(items[k]); });
    $('inv-stats').innerHTML = '<span class="' + (low.length ? 'is-low' : '') + '"><b>' + low.length + '</b> running low</span>'

      var row = '<div class="inv-row' + (lowNow ? ' is-low' : '') + '" data-p="' + esc(k) + '">'
        + '<div class="inv-name"><b>' + esc(k) + (lowNow ? '<span class="inv-tag">' + (it.count <= 0 ? 'Out' : 'Low') + '</span>' : '') + '</b><small>' + sub + '</small></div>'

        + '<div class="inv-btns">' + (it ? '<button type="button" class="pm" data-adj="-1" aria-label="Take one away from ' + esc(k) + '">−</button><button type="button" class="pm" data-adj="1" aria-label="Add one to ' + esc(k) + '">+</button>' : '')
        + '<button type="button" data-edit>' + (it ? 'Edit' : 'Count it') + '</button></div>';
      if (invOpen === k) row += '<form class="inv-edit" novalidate>'
        + '<div class="pt-field"><label>In stock</label><input type="number" step="1" inputmode="numeric" data-f="count" value="' + (it ? it.count : '') + '"></div>'
        + '<div class="pt-field"><label>Low at <span class="opt">(optional)</span></label><input type="number" min="0" step="1" inputmode="numeric" data-f="low" value="' + (it && it.low != null ? it.low : '') + '"></div>'
        + '<div class="pt-field wide-f"><label>Why <span class="opt">(optional)</span></label><input type="text" maxlength="120" data-f="reason" placeholder="' + (it ? 'Counted, new delivery, damaged…' : 'First count') + '"></div>'
        + '<button class="btn pt-go" type="submit">Save</button><button class="pt-cancel" type="button" data-cancel>Cancel</button>'

        + log.slice(0, 50).map(function (e) {

          return '<tr><td>' + shortDate(e.at) + ', ' + new Date(e.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '</td><td>' + esc(e.product) + '</td><td>' + ch + '</td>'
            + '<td>' + (e.count == null ? '–' : e.count) + '</td><td>' + esc(e.reason) + (e.staff ? '<br><small style="color:#6B6B68">' + esc(e.staff) + '</small>' : '') + '</td></tr>';
        }).join('') + '</tbody></table>';
  }
  $('inv-q').addEventListener('input', function () { invShown = 60; drawStock(); });
  document.querySelectorAll('input[name=inv-show]').forEach(function (r) { r.addEventListener('change', function () { invShown = 60; drawStock(); }); });
  $('inv-list').addEventListener('click', function (e) {

  $('inv-list').addEventListener('submit', function (e) {

    if (low && !/^\d+$/.test(low)) { get('error').textContent = 'The “low at” number should be a whole number.'; get('low').focus(); return; }
    f.querySelector('.pt-go').disabled = true;
    changeStock({ action: 'set', product: p, count: Number(count), low: low === '' ? '' : Number(low), reason: get('reason').value.trim() }, function (msg) {
      if (msg) { f.querySelector('.pt-go').disabled = false; get('error').textContent = msg; return; }
      invOpen = null;
    });
  });

  // ---------- Start ----------
  addRow(); preview();
  show(!!code());
})();
</script>

</body>
