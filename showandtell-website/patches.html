<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The design menu: Show and Tell Co</title>
<meta name="description" content="Show and Tell Co: printed pun cards, pick-your-patch totes and tees, and iron-on patches. Order on WhatsApp.">
<link rel="icon" type="image/png" href="images/brand/wordmark-violet.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#FDFDFD}
.disp{font-family:'Fraunces',Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1}
a{color:#5D1AFA}a:hover{color:#3D0CB0}
.thumb:focus-visible,.chip:focus-visible,.opt:focus-visible,.crumb:focus-visible{outline:3px solid #5D1AFA;outline-offset:3px}
.acc summary{cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc[open] .chev{transform:rotate(180deg)}
</style>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header style="background: #5D1AFA; color: #FDFDFD"><div id="site-header" data-page="designs"></div></header>
<script src="assets/header.js"></script>
<noscript><p style="padding:16px;font-family:sans-serif">Please turn on JavaScript to use this page.</p></noscript>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #1A0B45; background: #FDFDFD">


<main style="max-width: 1240px; margin: 0 auto; padding: 48px 5% 80px; display: flex; flex-direction: column; gap: 32px">

<!-- LIST -->
<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; text-align: center">
<h1 class="disp" style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 900; letter-spacing: -0.02em">The design menu.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3B2E6B; max-width: 640px">Every design comes as a print or an embroidered patch, and some as pins. Add them to a tote or tee and we'll press them on, or buy patches and pins on their own.</p>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div role="group" aria-label="Filter by category" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="7">
<button class="chip" type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #5D1AFA; background: {{ f.bg }}; color: {{ f.fg }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{ f.label }}</button>
</sc-for>
</div>
<div role="group" aria-label="Filter by type" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<sc-for list="{{ typeFilters }}" as="f" hint-placeholder-count="3">
<button class="chip" type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 2px solid #1A0B45; background: {{ f.bg }}; color: {{ f.fg }}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{ f.label }}</button>
</sc-for>
</div>
</div>

<ul aria-label="Designs"style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 40px 28px">
<sc-for list="{{ patches }}" as="p" hint-placeholder-count="12">
<li>
<button class="thumb" type="button" aria-label="{{ p.name }}. Open details." onClick="{{ p.pick }}" style="width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 14px; text-align: left; font-family: inherit; color: #1A0B45">
<img src="{{ p.src }}" alt="" style="width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; display: block; filter: drop-shadow(0 8px 14px rgba(26, 11, 69, 0.16))">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #5D1AFA">{{ p.cat }}</span>
<span class="disp" style="font-size: 21px; line-height: 1.2; font-weight: 800">{{ p.name }}</span>
<span style="font-size: 16px; font-weight: 700">{{ p.price }}</span>
</span>
</button>
</li>
</sc-for>
</ul>
</div>
</sc-if>

<!-- DETAIL -->
<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: #3B2E6B">
<button class="crumb" type="button" onClick="{{ toList }}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">Designs</button>
<span aria-hidden="true">›</span>
<button class="crumb" type="button" onClick="{{ toCat }}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">{{ patch.cat }}</button>
<span aria-hidden="true">›</span>
<span aria-current="page">{{ patch.name }}</span>
</nav>
<div style="display: flex; gap: 8px">
<button class="chip" type="button" onClick="{{ prev }}" aria-label="Previous design" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #CFC6F2; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Previous</button>
<button class="chip" type="button" onClick="{{ next }}" aria-label="Next design" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #CFC6F2; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Next</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

<section aria-label="Design image" style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 480px">
<img src="{{ mainImg }}" alt="{{ patch.name }} {{ typeWord }}" style="width: 100%; max-width: 520px; height: auto; display: block; filter: drop-shadow(0 18px 30px rgba(26, 11, 69, 0.2))">
</section>

<section aria-label="Design options" style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #5D1AFA">{{ patch.cat }} {{ typeWord }}</p>
<h1 class="disp" style="margin: 0; font-size: 40px; line-height: 1.08; font-weight: 900">{{ patch.name }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3B2E6B">{{ patch.desc }}</p>
<a href="#design-details" style="font-size: 15px; font-weight: 700">See full details</a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 22px; border-bottom: 1px solid #E3DCF7">
<p style="margin: 0; font-size: 30px; font-weight: 700">{{ unitLabel }} <span style="font-size: 16px; font-weight: 500; color: #3B2E6B">per {{ typeWord }}</span></p>
<p style="margin: 0; font-size: 15px; color: #3B2E6B">{{ totalLine }}</p>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">Type: <span style="font-weight: 500">{{ typeLabel }}</span></legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px">
<sc-for list="{{ typeOpts }}" as="t" hint-placeholder-count="2">
<button class="opt" type="button" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 4px; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: {{ t.border }}; background: #FDFDFD; color: #1A0B45; font-family: inherit; text-align: left; cursor: pointer">
<span style="display: flex; width: 100%; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 700"><span>{{ t.label }}</span><span>{{ t.price }}</span></span>
<span style="font-size: 13px; line-height: 1.4; color: #3B2E6B">{{ t.note }}</span>
</button>
</sc-for>
</div>
</fieldset>

<sc-if value="{{ soldAlone }}" hint-placeholder-val="{{ true }}">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">Quantity:<span style="font-weight: 500">{{ qtyName }}</span></legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px">
<sc-for list="{{ qtys }}" as="q" hint-placeholder-count="5">
<button class="opt" type="button" aria-pressed="{{ q.on }}" onClick="{{ q.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 8px; border-radius: 14px; border: {{ q.border }}; background: #FDFDFD; color: #1A0B45; font-family: inherit; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">{{ q.label }}</span>
<span style="font-size: 12px; color: #3B2E6B">{{ q.total }}</span>
</button>
</sc-for>
</div>
</fieldset>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{ soldAlone }}" hint-placeholder-val="{{ true }}">
<a href="{{ waLink }}" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; border-radius: 999px; background: #5D1AFA; color: #FDFDFD; font-size: 17px; font-weight: 700; text-decoration: none">Buy the {{ typeWord }} only · {{ totalShort }}</a>
</sc-if>
<sc-if value="{{ notSoldAlone }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 14px 18px; border-radius: 16px; background: #EFE9FF; font-size: 15px; line-height: 1.5; font-weight: 700; text-align: center">Prints are pressed on by us. Add it to a tote or tee.</p>
</sc-if>
<a href="build-your-tote.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 2px solid #1A0B45; color: #1A0B45; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box">Add it to a tote or tee</a>
<p style="margin: 2px 0 0; font-size: 14px; line-height: 1.5; color: #3B2E6B; text-align: center">{{ addHint }}</p>
<p style="margin: 0; font-size: 14px; color: #3B2E6B; text-align: center">Ready in 3 working days · Delivery charges apply</p>
</div>
</section>
</div>

<section id="design-details" aria-label="Design details"style="display: flex; flex-direction: column; border-top: 1px solid #E3DCF7">
<details class="acc" open="{{ true }}" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Product description</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">{{ patch.desc }}</p>
<p style="margin: 0">{{ moreLine }}</p>
</div>
</details>
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Specifications</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<dl style="margin: 0 0 24px; display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); gap: 10px 24px; max-width: 760px; font-size: 16px">
<dt style="font-weight: 700">Type</dt><dd style="margin: 0; color: #3B2E6B">{{ specType }}</dd>
<dt style="font-weight: 700">Size</dt><dd style="margin: 0; color: #3B2E6B">[{{ sizeWord }} SIZE, e.g. 8 cm wide]</dd>
<dt style="font-weight: 700">Works on</dt><dd style="margin: 0; color: #3B2E6B">Cotton, canvas and denim</dd>
<dt style="font-weight: 700">Category</dt><dd style="margin: 0; color: #3B2E6B">{{ patch.cat }}</dd>
</dl>
</details>
<sc-if value="{{ isPrint }}" hint-placeholder-val="{{ false }}">
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">How it's pressed</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">We heat-press your print onto the bag with a professional press. Care: wait 24 hours before the first wash, wash cold and inside out, and air dry.</p>
</div>
</details>
</sc-if>
<sc-if value="{{ isPin }}" hint-placeholder-val="{{ false }}">
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">How to wear it</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">Push the pin through the fabric and click the locking back into place. To move it, press the release on the back.</p>
</div>
</details>
</sc-if>
<sc-if value="{{ isPatch }}" hint-placeholder-val="{{ true }}">
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">How to iron it on</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<ol style="margin: 0 0 24px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; font-size: 16px; line-height: 1.55; color: #3B2E6B">
<li>Heat your iron to the cotton setting, with no steam.</li>
<li>Place the patch, cover it with a thin cloth and press firmly for about 30 seconds without sliding the iron.</li>
<li>Turn the item inside out and press the back for another 15 to 20 seconds.</li>
<li>Let it cool completely, and wait 24 hours before the first wash. Wash cold, inside out, and air dry.</li>
<li>For extra hold, add a few stitches around the edge.</li>
</ol>
</details>
</sc-if>
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Delivery</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">Ready in 3 working days, for pickup or delivery to your home. Delivery charges apply: they depend on your location and we confirm them on WhatsApp before you pay.</p>
</div>
</details>
</section>

<section aria-labelledby="more-h" style="display: flex; flex-direction: column; gap: 20px">
<h2 id="more-h" class="disp" style="margin: 0; font-size: 30px; font-weight: 900">More {{ patch.cat }} designs</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px">
<sc-for list="{{ related }}" as="r" hint-placeholder-count="4">
<li>
<button class="thumb" type="button" aria-label="{{ r.name }}. Open details." onClick="{{ r.pick }}" style="width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 10px; text-align: left; font-family: inherit; color: #1A0B45">
<img src="{{ r.src }}" alt="" style="width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; display: block; filter: drop-shadow(0 6px 10px rgba(26, 11, 69, 0.14))">
<span class="disp" style="font-size: 18px; font-weight: 800">{{ r.name }}</span>
<span style="font-size: 15px; font-weight: 700">{{ r.price }}</span>
</button>
</li>
</sc-for>
</ul>
</section>

</div>
</sc-if>
</main>

<footer style="background: #1A0B45; color: #FDFDFD">
<div style="max-width: 1240px; margin: 0 auto; padding: 56px 5% 40px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="index.html" aria-label="Show and Tell Co home" style="line-height: 0"><img src="images/brand/wordmark-white.png" alt="Show and Tell Co" style="height: 72px; width: auto"></a>
<p style="margin: 0; font-size: 16px; color: #FDFDFD">Pun-filled cards and pick-your-patch totes and tees.</p>
<p style="margin: 0; font-size: 14px; color: #CFC6F2">Patch bar experience in Abuja and Barcelona</p>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 16px">
<a href="cards.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Cards</a>
<a href="build-your-tote.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Build a tote</a>
<a href="patches.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Designs</a>
<a href="https://www.instagram.com/showandtell.co/" target="_blank" rel="noopener" style="color: #E4EE3F; text-decoration: none; padding: 10px 0">Instagram</a>
</nav>
</div>
<div style="max-width: 1240px; margin: 0 auto; padding: 0 5% 36px">
<p style="margin: 0; padding-top: 22px; border-top: 1px solid #3B2E6B; font-size: 14px; color: #CFC6F2">© 2026 Show and Tell Co · Delivery charges apply</p>
</div>
</footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script src="assets/menu.js"></script>
<script src="assets/prices.js"></script>
<script src="assets/catalog.js"></script>
<script>
// ---------- Your settings ----------
// WhatsApp number in international format, digits only (for example 2348012345678).
var WHATSAPP_NUMBER = '';
// Prices are in assets/prices.js.
var QTYS = [1, 2, 3, 5, 10];

// Keep TYPES the same as in the tote builder.
// The three kinds of design. Their prices are in assets/prices.js.
// soldAlone: whether people can buy this type on its own, without a tote or tee.
var TYPES = {
  print: { label: 'Print', soldAlone: false, note: 'Full colour, pressed flat onto your bag by us.' },
  patch: { label: 'Patch', soldAlone: true,  note: 'Raised embroidery with an iron-on back.' },
  pin:   { label: 'Pin',   soldAlone: true,  note: 'Enamel pin with a locking back. Clip it on, swap it around.' }
};

// The designs (PATCHES) are in assets/catalog.js.

// ---------- End of settings ----------

var FILTERS = ['All', 'Food', 'Snacks & drinks', 'Rides', 'Places', 'Culture', 'Sayings', 'Show & Tell'];

// The lowest price set across a design's types, shown as "from ...".
function fromLabel(d) {
  var set = typesOf(d).map(function (t) { return priceOf(d, t); }).filter(function (n) { return n != null; });
  return set.length ? 'from ' + money(Math.min.apply(null, set)) : '[PRICE]';
}
function plural(type, n) {
  var w = TYPES[type].label.toLowerCase();
  return n + ' ' + (n === 1 ? w : w + (type === 'patch' ? 'es' : 's'));
}
// The type a design opens on: the type being filtered, else patch, else its first type.
function startType(d, want) {
  var t = typesOf(d);
  return t.indexOf(want) >= 0 ? want : (t.indexOf('patch') >= 0 ? 'patch' : t[0]);
}

var TYPE_FILTERS = [['all', 'All types'], ['print', 'Prints'], ['patch', 'Patches'], ['pin', 'Pins']];
var SPEC_TYPE = { print: 'Print: full-colour heat transfer (DTF), pressed on by us', patch: 'Embroidered patch, iron-on backing', pin: 'Enamel pin, locking back' };
var MORE_LINE = {
  print: "Choose it as a print and we'll press it onto one of our totes or tees for you.",
  patch: "Buy it on its own for a jacket, cap or bag you already love, or add it to one of our totes or tees and we'll press it on for you.",
  pin: 'Buy it on its own to clip onto a jacket, cap or bag you already love, or add it to one of our totes or tees.'
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var self0 = this;
    window.addEventListener('regionchange', function () { self0.setState({}); });
    this.state = { mode: 'list', patch: 'p01', filter: 'All', typeFilter: 'all', type: 'patch', qty: 1 };
    // A link like patches.html?design=p04 opens that design; &type=print opens it as a print.
    var q = new URLSearchParams(location.search);
    var want = PATCHES.find(function (d) { return d.id === q.get('design'); });
    if (want) Object.assign(this.state, { mode: 'detail', patch: want.id, type: startType(want, q.get('type') || 'all') });
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var p0 = PATCHES.find(function (p) { return p.id === st.patch; }) || PATCHES[0];
    var types = typesOf(p0);
    var type = types.indexOf(st.type) >= 0 ? st.type : startType(p0, st.typeFilter);
    var word = TYPES[type].label.toLowerCase();
    var unit = priceOf(p0, type);
    var total = unit == null ? null : unit * st.qty;

    function open(id) {
      return function () {
        var d = PATCHES.find(function (p) { return p.id === id; });
        self.setState({ mode: 'detail', patch: id, type: startType(d, st.typeFilter), qty: 1 });
      };
    }

    var filters = FILTERS.map(function (f) {
      var on = f === st.filter;
      return { label: f, on: on ? 'true' : 'false', bg: on ? '#5D1AFA' : '#FDFDFD', fg: on ? '#FDFDFD' : '#5D1AFA', pick: function () { self.setState({ filter: f }); } };
    });

    // The Pins chip only shows once at least one design has a pin image.
    var typeFilters = TYPE_FILTERS.filter(function (f) { return f[0] !== 'pin' || hasPins(); }).map(function (f) {
      var on = f[0] === st.typeFilter;
      return { label: f[1], on: on ? 'true' : 'false', bg: on ? '#1A0B45' : '#FDFDFD', fg: on ? '#FDFDFD' : '#1A0B45', pick: function () { self.setState({ typeFilter: f[0] }); } };
    });

    var visible = PATCHES.filter(function (p) {
      return (st.filter === 'All' || p.cat === st.filter) && (st.typeFilter === 'all' || typesOf(p).indexOf(st.typeFilter) >= 0);
    });
    var patches = visible.map(function (p) {
      return { name: p.name, cat: p.cat, src: imgOf(p, st.typeFilter), price: fromLabel(p), pick: open(p.id) };
    });
    var pool = visible.length ? visible : PATCHES;
    var idx = pool.findIndex(function (p) { return p.id === st.patch; });
    function go(step) {
      var i = idx < 0 ? 0 : (idx + step + pool.length) % pool.length;
      var d = pool[i];
      self.setState({ patch: d.id, type: typesOf(d).indexOf(type) >= 0 ? type : startType(d, st.typeFilter), qty: 1 });
    }

    var related = PATCHES.filter(function (p) { return p.cat === p0.cat && p.id !== p0.id; }).slice(0, 4).map(function (p) {
      return { name: p.name, src: p.src, price: fromLabel(p), pick: open(p.id) };
    });

    var typeOpts = types.map(function (t) {
      var on = t === type;
      return {
        label: TYPES[t].label, price: money(priceOf(p0, t)), note: TYPES[t].note, on: on ? 'true' : 'false',
        border: on ? '2px solid #5D1AFA' : '2px solid #E3DCF7',
        pick: function () { self.setState({ type: t }); }
      };
    });

    var qtys = QTYS.map(function (n) {
      var on = n === st.qty;
      return {
        label: plural(type, n), on: on ? 'true' : 'false',
        total: unit == null ? '[TOTAL]' : money(unit * n),
        border: on ? '2px solid #5D1AFA' : '2px solid #E3DCF7',
        pick: function () { self.setState({ qty: n }); }
      };
    });

    var orderMsg = "Hi Show and Tell! I'd like to buy " + st.qty + ' x the ' + p0.name + ' ' + word + ' on its own'
      + (total != null ? ' (' + money(total) + ')' : '') + '.' + regionNote();

    return {
      isList: st.mode === 'list', isDetail: st.mode === 'detail',
      filters: filters, typeFilters: typeFilters, patches: patches, related: related, typeOpts: typeOpts, qtys: qtys,
      patch: p0,
      mainImg: imgOf(p0, type), typeWord: word, typeLabel: TYPES[type].label,
      isPrint: type === 'print', isPatch: type === 'patch', isPin: type === 'pin',
      soldAlone: TYPES[type].soldAlone, notSoldAlone: !TYPES[type].soldAlone,
      specType: SPEC_TYPE[type], sizeWord: word.toUpperCase(), moreLine: MORE_LINE[type],
      unitLabel: money(unit),
      totalLine: total == null || !TYPES[type].soldAlone ? '' : 'Total for ' + plural(type, st.qty) + ': ' + money(total),
      totalShort: total == null ? '[TOTAL]' : money(total),
      qtyName: plural(type, st.qty),
      addHint: 'In the builder, pick a tote or tee, choose Add as: ' + TYPES[type].label + ', and find ' + p0.name + ' under ' + p0.cat + '.',
      waLink: 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(orderMsg),
      toList: function () { self.setState({ mode: 'list' }); },
      toCat: function () { self.setState({ mode: 'list', filter: p0.cat }); },
      prev: function () { go(-1); },
      next: function () { go(1); }
    };
  }
}

DCLite.mount(Component);
</script>
</body>
</html>
