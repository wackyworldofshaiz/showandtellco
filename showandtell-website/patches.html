<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patches: Show and Tell Co</title>
<meta name="description" content="Show and Tell Co: printed pun cards, pick-your-patch totes and tees, and iron-on patches. Order on WhatsApp.">
<link rel="icon" type="image/png" href="images/brand/wordmark-violet.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#FDFDFD}
.disp{font-family:'Fraunces',Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1}
a{color:#5D1AFA}a:hover{color:#3D0CB0}
.thumb:focus-visible,.chip:focus-visible,.opt:focus-visible,.crumb:focus-visible{outline:3px solid #5D1AFA;outline-offset:3px}
.acc summary{cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc[open] .chev{transform:rotate(180deg)}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<noscript><p style="padding:16px;font-family:sans-serif">Please turn on JavaScript to use this page.</p></noscript>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #1A0B45; background: #FDFDFD">

<header style="background: #5D1AFA; color: #FDFDFD">
<div style="max-width: 1240px; margin: 0 auto; padding: 18px 5%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="Back to Show and Tell Co home" style="display: block; line-height: 0"><img src="images/brand/wordmark-white.png" alt="Show and Tell Co" style="height: 48px; width: auto"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 16px; font-weight: 600">
<a href="build-your-tote.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Build a tote</a>
<a href="cards.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Choose a card</a>
<a href="patches.html" aria-current="page" style="color: #E4EE3F; text-decoration: none; padding: 10px 0">Shop patches</a>
</nav>
</div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 48px 5% 80px; display: flex; flex-direction: column; gap: 32px">

<!-- LIST -->
<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; text-align: center">
<h1 class="disp" style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 900; letter-spacing: -0.02em">The patch menu.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3B2E6B; max-width: 640px">Buy a patch on its own and iron it on yourself, or add it to a tote or tee and we'll press it on for you.</p>
</div>

<div role="group" aria-label="Filter patches" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="7">
<button class="chip" type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #5D1AFA; background: {{ f.bg }}; color: {{ f.fg }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{ f.label }}</button>
</sc-for>
</div>

<ul aria-label="Patches" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 40px 28px">
<sc-for list="{{ patches }}" as="p" hint-placeholder-count="12">
<li>
<button class="thumb" type="button" aria-label="{{ p.name }}. Open details." onClick="{{ p.pick }}" style="width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 14px; text-align: left; font-family: inherit; color: #1A0B45">
<img src="{{ p.src }}" alt="" style="width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; display: block; filter: drop-shadow(0 8px 14px rgba(26, 11, 69, 0.16))">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #5D1AFA">{{ p.cat }}</span>
<span class="disp" style="font-size: 21px; line-height: 1.2; font-weight: 800">{{ p.name }}</span>
<span style="font-size: 16px; font-weight: 700">{{ p.price }}</span>
</span>
</button>
</li>
</sc-for>
</ul>
</div>
</sc-if>

<!-- DETAIL -->
<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: #3B2E6B">
<button class="crumb" type="button" onClick="{{ toList }}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">Patches</button>
<span aria-hidden="true">›</span>
<button class="crumb" type="button" onClick="{{ toCat }}" style="min-height: 40px; padding: 0; border: 0; background: transparent; color: #5D1AFA; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">{{ patch.cat }}</button>
<span aria-hidden="true">›</span>
<span aria-current="page">{{ patch.name }}</span>
</nav>
<div style="display: flex; gap: 8px">
<button class="chip" type="button" onClick="{{ prev }}" aria-label="Previous patch" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #CFC6F2; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Previous</button>
<button class="chip" type="button" onClick="{{ next }}" aria-label="Next patch" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #CFC6F2; background: #FDFDFD; color: #1A0B45; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Next</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

<section aria-label="Patch image" style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 480px">
<img src="{{ patch.src }}" alt="{{ patch.name }} patch" style="width: 100%; max-width: 520px; height: auto; display: block; filter: drop-shadow(0 18px 30px rgba(26, 11, 69, 0.2))">
</section>

<section aria-label="Patch options" style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #5D1AFA">{{ patch.cat }} patch</p>
<h1 class="disp" style="margin: 0; font-size: 40px; line-height: 1.08; font-weight: 900">{{ patch.name }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3B2E6B">{{ patch.desc }}</p>
<a href="#patch-details" style="font-size: 15px; font-weight: 700">See full details</a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 22px; border-bottom: 1px solid #E3DCF7">
<p style="margin: 0; font-size: 30px; font-weight: 700">{{ unitLabel }} <span style="font-size: 16px; font-weight: 500; color: #3B2E6B">per patch</span></p>
<p style="margin: 0; font-size: 15px; color: #3B2E6B">{{ totalLine }}</p>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">Quantity: <span style="font-weight: 500">{{ qtyName }}</span></legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px">
<sc-for list="{{ qtys }}" as="q" hint-placeholder-count="5">
<button class="opt" type="button" aria-pressed="{{ q.on }}" onClick="{{ q.pick }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 8px; border-radius: 14px; border: {{ q.border }}; background: #FDFDFD; color: #1A0B45; font-family: inherit; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">{{ q.label }}</span>
<span style="font-size: 12px; color: #3B2E6B">{{ q.total }}</span>
</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 10px">
<a href="{{ waLink }}" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 24px; border-radius: 999px; background: #5D1AFA; color: #FDFDFD; font-size: 17px; font-weight: 700; text-decoration: none">Buy the patch only · {{ totalShort }}</a>
<a href="build-your-tote.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 2px solid #1A0B45; color: #1A0B45; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box">Add it to a tote or tee</a>
<p style="margin: 2px 0 0; font-size: 14px; line-height: 1.5; color: #3B2E6B; text-align: center">{{ addHint }}</p>
<p style="margin: 0; font-size: 14px; color: #3B2E6B; text-align: center">Ready in 3 working days · Delivery charges apply</p>
</div>
</section>
</div>

<section id="patch-details" aria-label="Patch details" style="display: flex; flex-direction: column; border-top: 1px solid #E3DCF7">
<details class="acc" open="{{ true }}" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Product description</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">{{ patch.desc }}</p>
<p style="margin: 0">Buy it on its own for a jacket, cap or bag you already love, or add it to one of our totes or tees and we'll press it on for you.</p>
</div>
</details>
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Specifications</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<dl style="margin: 0 0 24px; display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); gap: 10px 24px; max-width: 760px; font-size: 16px">
<dt style="font-weight: 700">Type</dt><dd style="margin: 0; color: #3B2E6B">[Embroidered / printed], iron-on backing</dd>
<dt style="font-weight: 700">Size</dt><dd style="margin: 0; color: #3B2E6B">[PATCH SIZE, e.g. 8 cm wide]</dd>
<dt style="font-weight: 700">Works on</dt><dd style="margin: 0; color: #3B2E6B">Cotton, canvas and denim</dd>
<dt style="font-weight: 700">Category</dt><dd style="margin: 0; color: #3B2E6B">{{ patch.cat }}</dd>
</dl>
</details>
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">How to iron it on</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<ol style="margin: 0 0 24px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; font-size: 16px; line-height: 1.55; color: #3B2E6B">
<li>Heat your iron to the cotton setting, with no steam.</li>
<li>Place the patch, cover it with a thin cloth and press firmly for about 30 seconds without sliding the iron.</li>
<li>Turn the item inside out and press the back for another 15 to 20 seconds.</li>
<li>Let it cool completely, and wait 24 hours before the first wash. Wash cold, inside out, and air dry.</li>
<li>For extra hold, add a few stitches around the edge.</li>
</ol>
</details>
<details class="acc" style="border-bottom: 1px solid #E3DCF7">
<summary style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; font-size: 20px; font-weight: 700"><span class="disp">Delivery</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; transition: transform 0.2s"><path d="M6 9 L12 15 L18 9" fill="none" stroke="#1A0B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></summary>
<div style="padding: 0 0 24px; max-width: 760px; font-size: 16px; line-height: 1.65; color: #3B2E6B">
<p style="margin: 0">Ready in 3 working days, for pickup or delivery to your home. Delivery charges apply: they depend on your location and we confirm them on WhatsApp before you pay.</p>
</div>
</details>
</section>

<section aria-labelledby="more-h" style="display: flex; flex-direction: column; gap: 20px">
<h2 id="more-h" class="disp" style="margin: 0; font-size: 30px; font-weight: 900">More {{ patch.cat }} patches</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px">
<sc-for list="{{ related }}" as="r" hint-placeholder-count="4">
<li>
<button class="thumb" type="button" aria-label="{{ r.name }}. Open details." onClick="{{ r.pick }}" style="width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 10px; text-align: left; font-family: inherit; color: #1A0B45">
<img src="{{ r.src }}" alt="" style="width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: contain; display: block; filter: drop-shadow(0 6px 10px rgba(26, 11, 69, 0.14))">
<span class="disp" style="font-size: 18px; font-weight: 800">{{ r.name }}</span>
<span style="font-size: 15px; font-weight: 700">{{ r.price }}</span>
</button>
</li>
</sc-for>
</ul>
</section>

</div>
</sc-if>
</main>

<footer style="background: #1A0B45; color: #FDFDFD">
<div style="max-width: 1240px; margin: 0 auto; padding: 56px 5% 40px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="index.html" aria-label="Show and Tell Co home" style="line-height: 0"><img src="images/brand/wordmark-white.png" alt="Show and Tell Co" style="height: 72px; width: auto"></a>
<p style="margin: 0; font-size: 16px; color: #FDFDFD">Pun-filled cards and pick-your-patch totes and tees.</p>
<p style="margin: 0; font-size: 14px; color: #CFC6F2">Patch bar experience in Abuja and Barcelona</p>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 16px">
<a href="cards.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Cards</a>
<a href="build-your-tote.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Build a tote</a>
<a href="patches.html" style="color: #FDFDFD; text-decoration: none; padding: 10px 0">Patches</a>
<a href="https://www.instagram.com/showandtell.co/" target="_blank" rel="noopener" style="color: #E4EE3F; text-decoration: none; padding: 10px 0">Instagram</a>
</nav>
</div>
<div style="max-width: 1240px; margin: 0 auto; padding: 0 5% 36px">
<p style="margin: 0; padding-top: 22px; border-top: 1px solid #3B2E6B; font-size: 14px; color: #CFC6F2">© 2026 Show and Tell Co · Delivery charges apply</p>
</div>
</footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
// ---------- Your settings ----------
// WhatsApp number in international format, digits only (for example 2348012345678).
var WHATSAPP_NUMBER = '';
var CURRENCY = '₦';
var PATCH_PRICE = 9500; // default price per patch; a patch can override it with its own price
var QTYS = [1, 2, 3, 5, 10];

// Keep this list the same as the one in the tote builder.
var PATCHES = [
  { id: 'p01', name: 'Abuja City Gate', cat: 'Places', price: null, src: 'images/patches/abuja-gate.webp', desc: 'The gate that welcomes you into Abuja, with the green-white-green flying above it and the road stretching ahead.' },
  { id: 'p02', name: 'Plantain', cat: 'Food', price: null, src: 'images/patches/plantain.webp', desc: 'A ripe bunch of plantain on a green leaf, ready to become dodo.' },
  { id: 'p03', name: 'Meat pie', cat: 'Food', price: null, src: 'images/patches/meat-pie.webp', desc: 'A golden meat pie, broken open to show the filling. Party-tray essential.' },
  { id: 'p04', name: 'Jollof and chicken', cat: 'Food', price: null, src: 'images/patches/jollof.webp', desc: 'A green-and-white bowl of jollof with a chicken leg on top. The only correct answer at any party.' },
  { id: 'p05', name: 'Danfo, full house', cat: 'Rides', price: null, src: 'images/patches/danfo-busy.webp', desc: 'A yellow Lagos danfo packed to the windows, with one arm hanging out for good measure.' },
  { id: 'p06', name: 'Danfo', cat: 'Rides', price: null, src: 'images/patches/danfo.webp', desc: 'The classic yellow Lagos bus with its door wide open. Enter with your change ready.' },
  { id: 'p07', name: 'Keke', cat: 'Rides', price: null, src: 'images/patches/keke.webp', desc: 'A yellow-and-black keke, the quickest way through traffic.' },
  { id: 'p08', name: 'National Theatre', cat: 'Places', price: null, src: 'images/patches/national-theatre.webp', desc: 'The National Theatre in Lagos, its famous curved roof framed by trees.' },
  { id: 'p09', name: 'Drums', cat: 'Culture', price: null, src: 'images/patches/drums.webp', desc: 'A set of drums with a beater, for anyone who can’t sit still when the music starts.' },
  { id: 'p10', name: 'Gala', cat: 'Snacks & drinks', price: null, src: 'images/patches/gala.webp', desc: 'The sausage roll in the red-and-yellow wrapper. A traffic snack legend.' },
  { id: 'p11', name: 'Green passport', cat: 'Culture', price: null, src: 'images/patches/passport.webp', desc: 'The green passport, for the japa crew, the frequent flyers and everyone who carries home with them.' },
  { id: 'p12', name: 'Puff-puff', cat: 'Snacks & drinks', price: null, src: 'images/patches/puff-puff.webp', desc: 'A striped bowl piled high with golden puff-puff. Nobody stops at one.' },
  { id: 'p13', name: 'Pure water', cat: 'Snacks & drinks', price: null, src: 'images/patches/pure-water.webp', desc: 'The sachet of pure water, cold and perfect on a hot afternoon.' },
  { id: 'p14', name: 'Suya', cat: 'Food', price: null, src: 'images/patches/suya.webp', desc: 'Three sticks of suya with onions, tomatoes and plenty of yaji.' },
  { id: 'p15', name: 'Palm wine', cat: 'Snacks & drinks', price: null, src: 'images/patches/palm-wine.webp', desc: 'A clay pot of fresh palm wine under a palm tree.' },
  { id: 'p16', name: 'Show and Tell logo', cat: 'Show & Tell', price: null, src: 'images/patches/show-and-tell.webp', desc: 'Our logo in pink and cream, with the lime sparkle.' },
  { id: 'p17', name: 'SuperYogo', cat: 'Snacks & drinks', price: null, src: 'images/patches/superyogo.webp', desc: 'The pink strawberry yoghurt sachet, a childhood favourite.' },
  { id: 'p18', name: 'Zuma Rock', cat: 'Places', price: null, src: 'images/patches/zuma-rock.webp', desc: 'Zuma Rock rising over green trees, with the road out of Abuja in front.' },
  { id: 'p19', name: 'Wahala', cat: 'Sayings', price: null, src: 'images/patches/wahala.webp', desc: 'One word for every kind of trouble, in cream script on red. Wear it as a warning or a lifestyle.' },
  { id: 'p20', name: 'Abuja stamp', cat: 'Places', price: null, src: 'images/patches/abuja-stamp.webp', desc: 'A green-and-gold postage stamp of Abuja, with the city gate in front of Aso Rock.' },
  { id: 'p21', name: 'No gree for anybody', cat: 'Sayings', price: null, src: 'images/patches/no-gree.webp', desc: 'A cup of coffee with an attitude. For anyone who stands their ground before breakfast.' },
  { id: 'p22', name: 'Lagos stamp', cat: 'Places', price: null, src: 'images/patches/lagos-stamp.webp', desc: 'A green-and-gold postage stamp of Lagos, with the Lekki–Ikoyi bridge and the city skyline.' },
  { id: 'p23', name: 'Nollywood', cat: 'Culture', price: null, src: 'images/patches/nollywood.webp', desc: 'A classic Nollywood VHS tape and its case, “Hit movie!” and all. For everyone who grew up watching Part 1 and Part 2.' }
];
// ---------- End of settings ----------

var FILTERS = ['All', 'Food', 'Snacks & drinks', 'Rides', 'Places', 'Culture', 'Sayings', 'Show & Tell'];

function money(n) { return n == null ? '[PRICE]' : CURRENCY + Number(n).toLocaleString('en-GB'); }
function priceOf(p) { return p.price != null ? p.price : PATCH_PRICE; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'list', patch: 'p01', filter: 'All', qty: 1 };
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var p0 = PATCHES.find(function (p) { return p.id === st.patch; }) || PATCHES[0];
    var unit = priceOf(p0);
    var total = unit == null ? null : unit * st.qty;

    function open(id) { return function () { self.setState({ mode: 'detail', patch: id, qty: 1 }); }; }

    var filters = FILTERS.map(function (f) {
      var on = f === st.filter;
      return { label: f, on: on ? 'true' : 'false', bg: on ? '#5D1AFA' : '#FDFDFD', fg: on ? '#FDFDFD' : '#5D1AFA', pick: function () { self.setState({ filter: f }); } };
    });

    var visible = PATCHES.filter(function (p) { return st.filter === 'All' || p.cat === st.filter; });
    var patches = visible.map(function (p) {
      return { name: p.name, cat: p.cat, src: p.src, price: money(priceOf(p)), pick: open(p.id) };
    });
    var pool = visible.length ? visible : PATCHES;
    var idx = pool.findIndex(function (p) { return p.id === st.patch; });
    function go(step) {
      var i = idx < 0 ? 0 : (idx + step + pool.length) % pool.length;
      self.setState({ patch: pool[i].id, qty: 1 });
    }

    var related = PATCHES.filter(function (p) { return p.cat === p0.cat && p.id !== p0.id; }).slice(0, 4).map(function (p) {
      return { name: p.name, src: p.src, price: money(priceOf(p)), pick: open(p.id) };
    });

    var qtys = QTYS.map(function (n) {
      var on = n === st.qty;
      return {
        label: n === 1 ? '1 patch' : n + ' patches', on: on ? 'true' : 'false',
        total: unit == null ? '[TOTAL]' : money(unit * n),
        border: on ? '2px solid #5D1AFA' : '2px solid #E3DCF7',
        pick: function () { self.setState({ qty: n }); }
      };
    });

    var orderMsg = "Hi Show and Tell! I'd like to buy " + st.qty + ' x the ' + p0.name + ' patch on its own'
      + (total != null ? ' (' + money(total) + ')' : '') + '.';

    return {
      isList: st.mode === 'list', isDetail: st.mode === 'detail',
      filters: filters, patches: patches, related: related, qtys: qtys,
      patch: p0,
      unitLabel: money(unit),
      totalLine: total == null ? '' : 'Total for ' + (st.qty === 1 ? '1 patch' : st.qty + ' patches') + ': ' + money(total),
      totalShort: total == null ? '[TOTAL]' : money(total),
      qtyName: st.qty === 1 ? '1 patch' : st.qty + ' patches',
      addHint: 'In the builder, pick a tote or tee and find ' + p0.name + ' under ' + p0.cat + '.',
      waLink: 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(orderMsg),
      toList: function () { self.setState({ mode: 'list' }); },
      toCat: function () { self.setState({ mode: 'list', filter: p0.cat }); },
      prev: function () { go(-1); },
      next: function () { go(1); }
    };
  }
}

DCLite.mount(Component);
</script>
</body>
</html>
